name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ConfigServer
          - Eureka
          - ApiGatewayBG
          - forum-service
          - BG-service

    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Instala o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '${{ matrix.service }}/pom.xml'

      - name: Compila o microsserviço (${{ matrix.service }})
        working-directory: ./${{ matrix.service }}
        run: mvn -B clean compile